# params/sim.yaml
visual_servo_node:
  ros__parameters:
    image_source:    sim
    image_topic:     /bluerov2_1/image
    controller:      sim
    wrench_topic:    /bluerov2_1/wrench
    tag_size:        0.10
    processing_rate: 2.0
    camera_params:  [1000.0, 1000.0, 640.0, 360.0]
    # Control gains
    forward_force:   5.0
    lateral_force:   0.0
    vertical_force:  0.0
    yaw_torque:      5.0
    # Control limits
    max_linear_force:    10.0
    max_angular_torque:  5.0
    target_distance:     2.0
